name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formato
        run: pnpm format:check
      - name: Tipos
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Tests
        run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cachear navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium
        run: pnpm --filter @comunidad/web exec playwright install --with-deps chromium
      - name: Flujos críticos (registro, login, menú, avisos)
        run: pnpm --filter @comunidad/web e2e

  migrations:
    name: Migraciones desde cero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vecinos
          POSTGRES_PASSWORD: vecinos
          POSTGRES_DB: vecinos_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migraciones sobre PostgreSQL limpio
        run: pnpm --filter @comunidad/api db:migrate
        env:
          DATABASE_URL: postgresql://vecinos:vecinos@localhost:5432/vecinos_test
          AUTH_SECRET: secreto-de-ci-solo-para-migraciones-1234
